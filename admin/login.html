<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Admin La Pulpe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --color-primary: #c48f5a;
            --color-bg: #0f0f0f;
            --color-surface: #1a1a1a;
            --color-border: #333333;
            --color-text: #ffffff;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            background: var(--color-surface);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid var(--color-border);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .login-logo {
            color: var(--color-primary);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: block;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 10px;
            padding: 1rem;
            color: white;
            font-size: 1rem;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .login-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <span class="login-logo">LA PULPE</span>
        <h2 style="margin-bottom: 2rem;">Acceso Propietario</h2>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Usuario</label>
                <input type="text" id="username" class="form-input" required placeholder="admin">
            </div>
            <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-input" required placeholder="••••••••">
            </div>
            <button type="submit" class="login-btn">Entrar</button>
            <p id="errorMsg" class="error-msg">Usuario o contraseña incorrectos</p>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Simple static credentials as requested
            if (user === 'admin' && pass === 'pulpe2026') {
                sessionStorage.setItem('admin_token', 'authenticated_' + Date.now());
                window.location.href = 'index.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        });

        // If already logged in, redirect
        if (sessionStorage.getItem('admin_token')) {
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
